name: test

# Nothing ran the tests. The only workflows were gitleaks and release, so a
# commit that broke the build reached a tag before anyone found out — and the
# release job builds without testing, which means it would have shipped it.
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch: {}
  # For linux-tun-dind only. Nesting a docker daemon inside the test container is
  # slow and flaky enough that it would cost every PR more than it catches, but
  # the code it covers (sing-tun's DOCKER-USER reconciliation) has no other test
  # at all — the chain does not exist unless a real daemon made it.
  schedule:
    - cron: '37 4 * * *'

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # third_party/sing-box
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./cmd/... ./internal/... ./pkg/...
      - name: test
        run: go test ./cmd/... ./internal/... ./pkg/...

  # The gateway ships for four targets and only one gets built by `go test`. A
  # compile error on Linux or Windows is not something to find out at tag time,
  # which used to be the only moment anything built them.
  #
  # A matrix, not a loop: as four sequential builds of a dependency graph this
  # size (sing-box + tailscale + gvisor) it was five minutes of the six the whole
  # workflow took, and each target has its own build cache anyway, so there was
  # nothing to share by keeping them together.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -tags "with_clash_api with_quic with_utls with_grpc with_gvisor with_wireguard with_tailscale" \
            -o /dev/null .

  # One Linux binary for every e2e suite to share.
  #
  # Each suite used to compile its own — the same source, the same tags, three
  # times over. Building it once costs the suites nothing in wall clock (they wait
  # for a job that is faster than the build they were doing anyway) and saves two
  # full compiles per run.
  testbin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the e2e binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -tags "with_clash_api with_quic with_utls with_gvisor" -o trust-proxy-e2e .
      - uses: actions/upload-artifact@v4
        with:
          name: trust-proxy-e2e
          path: trust-proxy-e2e
          retention-days: 1

  # The engine's own end-to-end suite: default-deny, whitelist, no-proxy,
  # blacklist, custom rules, and DNS following the route. Offline and
  # deterministic, so it belongs in CI rather than in somebody's VM.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-go
      - run: ./trust-proxy selftest

  # The Linux service lifecycle under a real systemd: install → claim → the CLI
  # works with nothing exported → TUN captures and default-deny refuses →
  # `kill -9` recovery → takeover with no pid file → uninstall leaves only data.
  # This is the one-command flow the project promises, so it gates the branch.
  linux-service:
    needs: testbin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: trust-proxy-e2e
      - name: e2e-linux
        run: |
          chmod +x trust-proxy-e2e
          TP_TEST_BINARY="$PWD/trust-proxy-e2e" make e2e-linux

  # TUN capture of forwarded traffic (the nftables auto_redirect path). The job
  # above curls from the gateway host, which is nftables' output chain; a
  # container's veth arrives on prerouting/forward, and auto_redirect is the only
  # reason those packets enter the tunnel. "Linux TUN captures Docker/containerd
  # bridge egress" had no test until this one, and the K8s DaemonSet shape rests
  # entirely on it being true.
  linux-tun:
    needs: testbin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: trust-proxy-e2e
      - name: e2e-tun
        run: |
          chmod +x trust-proxy-e2e
          TP_TEST_BINARY="$PWD/trust-proxy-e2e" make e2e-tun

  # The DOCKER-USER half, with a real dockerd nested in the test container.
  # linux-tun above reproduces the forwarded path with a bridge and a netns —
  # the same kernel path, but no Docker firewall. dockerd's DOCKER-USER rules run
  # before its own accepts, so without sing-tun's compatibility rules a container
  # reaches nothing while the gateway reports it captured everything.
  # Nightly and on demand, not per-PR: nested daemons are slow and fragile.
  linux-tun-dind:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: testbin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: trust-proxy-e2e
      - name: e2e-tun-dind
        run: |
          chmod +x trust-proxy-e2e
          TP_TEST_BINARY="$PWD/trust-proxy-e2e" make e2e-tun-dind

  # Every command that rewrites policy rebuilds the sing-box config, and a config
  # the box refuses is a gateway that stops enforcing anything. About twenty such
  # commands had no e2e coverage at all until one of them shipped broken.
  linux-policy:
    needs: testbin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: trust-proxy-e2e
      - name: e2e-policy
        run: |
          chmod +x trust-proxy-e2e
          TP_TEST_BINARY="$PWD/trust-proxy-e2e" make e2e-policy

  # What the gateway does to packets. The suites above prove commands succeed and
  # the service comes back; this one proves the product's actual claim — that an
  # unlisted destination cannot leave, that Deny beats Permit, and that a routing
  # decision never opens the gate.
  linux-dataplane:
    needs: testbin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: trust-proxy-e2e
      - name: e2e-dataplane
        run: |
          chmod +x trust-proxy-e2e
          TP_TEST_BINARY="$PWD/trust-proxy-e2e" make e2e-dataplane

  # The container image the Kubernetes DaemonSet runs. Built here, never pushed:
  # release.yml publishes it, and a Dockerfile that only ever runs at tag time
  # breaks at tag time — which is the worst moment to find out. amd64 only, since
  # what breaks is the build (submodule, embed_ui, apt), not the architecture.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # go.mod replaces sing-box with third_party/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trust-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A built image is not a working one. `version` exercises the binary, and
      # `nft --version` checks the one package the DaemonSet cannot do without:
      # auto_redirect is how forwarded Pod traffic gets captured at all.
      - name: smoke
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/trust-proxy trust-proxy:ci version
          docker run --rm --entrypoint nft trust-proxy:ci --version

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compiling the shell here is the point: its per-OS elevation is behind
      # cfg(target_os), so the Linux branch (pkexec) had never been through a
      # compiler on the macOS machine this was written on.
      - name: cargo test
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
          # tauri-build checks that every externalBin exists before it will
          # compile anything, and the real sidecar is a 60MB Go binary that this
          # job has no reason to build — it is here to put the Rust through a
          # compiler, not to produce a bundle. An empty file of the right name
          # satisfies the check; `make build-app` is what makes a real one.
          mkdir -p binaries
          touch "binaries/trust-proxy-$(rustc -vV | sed -n 's/^host: //p')"
          cargo test

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # dashboard pins pnpm 11, which imports node:sqlite
      - name: typecheck and test
        working-directory: dashboard
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          npx tsc --noEmit
          corepack pnpm test
