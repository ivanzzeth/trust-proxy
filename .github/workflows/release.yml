name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write # ghcr.io/<owner>/trust-proxy

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # pulls third_party/sing-box

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: dashboard/package.json pins pnpm 11, which imports
          # node:sqlite — absent in 20, so every release since v0.7.0 died on
          # `pnpm install` with "No such built-in module: node:sqlite" before it
          # built anything.
          node-version: 22

      - name: Build dashboard (embedded into the binary)
        run: |
          set -euo pipefail
          corepack enable
          cd dashboard
          corepack pnpm install --frozen-lockfile
          corepack pnpm build

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # embed_ui bakes dashboard/dist into the binary -> true single file.
          TAGS: with_clash_api with_quic with_utls with_grpc with_gvisor with_wireguard with_tailscale embed_ui
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bin=trust-proxy
          [ "$GOOS" = windows ] && bin=trust-proxy.exe
          go build -tags "$TAGS" -trimpath \
            -ldflags "-s -w -X github.com/ivanzzeth/trust-proxy/cmd.version=${VERSION}" \
            -o "$bin" .

          pkg="trust-proxy_${VERSION}_${GOOS}_${GOARCH}"
          mkdir "$pkg"
          cp "$bin" "$pkg"/
          cp README.md "$pkg"/ 2>/dev/null || true
          # No configs/ in the package. The gateway seeds <data>/config.json from
          # the copy compiled into this binary, so a second one in the tarball is
          # at best redundant — and it used to be worse than that: the seed was
          # read from ./configs/config.json, so unpacking and running
          # `sudo ./trust-proxy install` from inside the directory took the
          # tarball's copy instead. One binary, one config, no cwd in it.
          if [ "$GOOS" = windows ]; then
            zip -r "${pkg}.zip" "$pkg"
          else
            tar czf "${pkg}.tar.gz" "$pkg"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            trust-proxy_*.tar.gz
            trust-proxy_*.zip
          generate_release_notes: true

  # The container image, for the Kubernetes DaemonSet (deploy/kubernetes,
  # deploy/helm) and for anyone running the gateway from an image.
  #
  # A separate job rather than a fifth matrix entry: this builds through buildx
  # for two architectures in one manifest, and it publishes to a registry rather
  # than to the GitHub release. Failing to push the image must not cost the
  # binaries their release.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # go.mod replaces sing-box with third_party/

      - uses: docker/setup-qemu-action@v3 # arm64 without an arm64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased by the action: ghcr.io rejects uppercase, and GitHub
          # usernames may contain it.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
