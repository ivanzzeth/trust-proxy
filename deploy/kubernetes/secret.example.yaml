# Example only — do NOT apply this file as-is, and do not commit a filled-in
# copy. The DaemonSet reads the `api-token` key from a Secret named
# `trust-proxy`; create it out of band:
#
#   kubectl -n trust-proxy create secret generic trust-proxy \
#     --from-literal=api-token="$(openssl rand -hex 32)"
#
# The token gates /api/* on every node, and hostNetwork means that API is
# listening on the node's own address. A cluster where this Secret is missing is
# a cluster where reaching port 21585 is enough to rewrite a node's egress
# policy — the DaemonSet marks the key `optional: true` only so a first
# `kubectl apply` in a lab does not fail before you have created it.
#
# Rotating: replace the Secret, then `kubectl -n trust-proxy rollout restart ds/trust-proxy`.
# The flag is read at start-up, so the Pods must be replaced for a new token to
# take effect — and the rollout is one node at a time (maxUnavailable: 1), so
# the cluster does not lose egress while it happens.
apiVersion: v1
kind: Secret
metadata:
  name: trust-proxy
  namespace: trust-proxy
  labels:
    app.kubernetes.io/name: trust-proxy
type: Opaque
stringData:
  api-token: REPLACE-ME-WITH-A-RANDOM-32-BYTE-HEX-STRING
