apiVersion: v1
kind: Namespace
metadata:
  name: trust-proxy
  labels:
    app.kubernetes.io/name: trust-proxy
    # The DaemonSet needs hostNetwork, hostPID and NET_ADMIN. Under Pod Security
    # Admission that is `privileged` and nothing less — a `baseline` or
    # `restricted` namespace rejects the Pod outright, and the rejection shows up
    # as "0 pods scheduled" with the reason buried in the ReplicaSet events.
    # Keep the gateway in its own namespace so this exemption covers it alone.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
