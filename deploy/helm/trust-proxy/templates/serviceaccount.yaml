{{- if .Values.serviceAccount.create }}
# No Role and no RoleBinding, on purpose. The gateway does not talk to the
# Kubernetes API — it captures packets on the node it runs on. The
# ServiceAccount exists to *be named*: to give the Pod an identity that is not
# `default`, and somewhere to hang an image-pull secret or your cluster's own
# admission policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trust-proxy.serviceAccountName" . }}
  labels: {{- include "trust-proxy.labels" . | nindent 4 }}
{{- with .Values.image.pullSecrets }}
imagePullSecrets: {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
