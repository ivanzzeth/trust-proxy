[package]
name = "trust-proxy-desktop"
version = "0.11.2"
description = "trust-proxy desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
